<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Especial Viña 2026 | El Epicentro</title>
  <meta name="description" content="Especial Viña 2026: noticias, parrilla de artistas, jurado y competencias." />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
  <a class="skip" href="#contenido">Saltar al contenido</a>

  <header class="topbar">
    <div class="wrap topbar__inner">
      <div class="brand">
        <span class="brand__dot" aria-hidden="true"></span>
        <span class="brand__name">ESPECIAL EL EPICENTRO - VIÑA 2026</span>
      </div>
      <nav class="nav">
        <a href="#noticias" class="nav__link">Noticias</a>
        <a href="#parrilla" class="nav__link">Parrilla</a>
        <a href="#jurado" class="nav__link">Jurado</a>
        <a href="#competencia" class="nav__link">Competencia</a>
      </nav>
    </div>
  </header>

  <main id="contenido">
    <section id="portada" class="hero">
      <div class="wrap">
        <div class="hero__banner">
          <img src="https://www.epicentrochile.com/wp-content/uploads/2026/02/karen-rafa.jpg" alt="Viña 2026">
        </div>
      </div>
    </section>

    <section id="parrilla" class="section-parrilla">
      <div class="wrap">
        <div class="section__head">
          <h2 class="section__title">Parrilla de Artistas</h2>
        </div>
        <div id="parrillaContainer" class="parrilla-horizontal">
          </div>
      </div>
    </section>

    <section id="noticias" class="section">
      <div class="wrap">
        <div class="section__head">
          <h2 class="section__title">Últimas noticias</h2>
        </div>
        <div class="newsbox">
          <ul id="newsList" class="newslist"></ul>
          <a class="newsbox__more" href="https://www.epicentrochile.com/tag/vina2026/" target="_blank">Más noticias en EpicentroChile.com</a>
        </div>
      </div>
    </section>

    <section id="jurado" class="section">
      <div class="wrap">
        <div class="section__head">
          <h2 class="section__title">Jurado</h2>
        </div>
        <div id="grid" class="grid"></div>
      </div>
    </section>

    <section id="competencia" class="section">
      <div class="wrap">
        <div class="section__head">
          <h2 class="section__title">Competencia</h2>
        </div>
        <div id="compGrid" class="grid"></div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal__backdrop" id="closeModal"></div>
    <div class="modal__panel">
      <button class="modal__close" id="btnCerrar" type="button">×</button>
      <div class="modal__content">
        <img id="modalImg" class="modal__img" src="" />
        <div>
          <h3 id="modalTitle" class="modal__title"></h3>
          <p id="modalBio" class="modal__bio"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
