<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Especial Viña 2026 | El Epicentro</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <div class="brand">
        <span class="brand__dot"></span>
        <span class="brand__name">EL EPICENTRO - VIÑA 2026</span>
      </div>
      <nav class="nav">
        <a href="#noticias" class="nav__link">Noticias</a>
        <a href="#parrilla" class="nav__link">Parrilla</a>
        <a href="#jurado" class="nav__link">Jurado</a>
      </nav>
    </div>
  </header>

  <main class="wrap main-layout">
    <section id="noticias" class="section">
      <h2 class="section__title">Últimas noticias</h2>
      <div class="newsbox">
        <ul id="newsList" class="newslist"></ul>
      </div>
    </section>

    <aside id="parrilla" class="sidebar">
      <h2 class="section__title">Programación Diaria</h2>
      <div id="parrillaContainer" class="sidebar__content"></div>
    </aside>
  </main>

  <section id="jurado" class="wrap section">
    <h2 class="section__title">Jurado</h2>
    <div id="grid" class="grid"></div>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="modal__backdrop" id="closeModal"></div>
    <div class="modal__panel">
      <div class="modal__content">
        <img id="modalImg" src="" class="modal__img" />
        <div>
          <h3 id="modalTitle"></h3>
          <p id="modalBio"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
