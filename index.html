<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Especial Viña 2026 | El Epicentro</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="topbar">
    <div class="wrap topbar__inner">
      <div class="brand">
        <span class="brand__dot"></span>
        <span class="brand__name">EL EPICENTRO · VIÑA 2026</span>
      </div>
      <nav class="nav">
        <a href="#noticias" class="nav__link">Noticias</a>
        <a href="#parrilla" class="nav__link">Parrilla</a>
        <a href="#jurado" class="nav__link">Jurado</a>
        <a href="#competencia" class="nav__link">Competencia</a>
      </nav>
    </div>
  </header>

  <main id="contenido" class="wrap">
    <section class="hero">
      <img src="https://www.epicentrochile.com/wp-content/uploads/2026/02/vina2026.png" alt="Viña 2026" class="hero__img" />
    </section>

    <section id="parrilla" class="section">
      <h2 class="section__title">Programación Oficial</h2>
      <div id="tabsNav" class="tabs-nav"></div>
      <div id="tabContent" class="tabs-grid">
        <p class="loading">Cargando programación...</p>
      </div>
    </section>

    <section id="noticias" class="section">
      <h2 class="section__title">Últimas Noticias</h2>
      <div class="newsbox">
        <ul id="newsList" class="newslist">
          <li class="loading">Sincronizando con sala de prensa...</li>
        </ul>
      </div>
    </section>

    <section id="jurado" class="section">
      <h2 class="section__title">Jurado</h2>
      <div id="grid" class="grid-jurado">
        <p class="loading">Cargando jurado...</p>
      </div>
    </section>

    <section id="competencia" class="section">
      <h2 class="section__title">Competencia</h2>
      <div id="compGrid" class="grid-jurado">
        <p class="loading">Cargando participantes...</p>
      </div>
    </section>
  </main>

  <div class="radio-bar">
    <div class="wrap radio-bar__inner">
      <div class="radio-info">
        <span class="live-dot"></span>
        <strong>EPICENTRO RADIO</strong> | <small>En Vivo desde Viña</small>
      </div>
      <button onclick="window.open('https://epicentrochile.com/radio', '_blank')" class="radio-btn">▶ ESCUCHAR</button>
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal__panel">
      <button class="modal__close" onclick="closeModal()">×</button>
      <div class="modal__content">
        <img id="modalImg" src="" alt="Foto" />
        <div>
          <h3 id="modalTitle"></h3>
          <p id="modalBio"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
