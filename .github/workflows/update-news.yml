name: Actualizar Noticias Epicentro
on:
  schedule:
    - cron: "*/15 * * * *" # Cada 15 minutos
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch News
        run: python scripts/fetch_news.py
      - name: Save
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/data/noticias.json
          git commit -m "Auto-update noticias" || exit 0
          git push
