name: Actualizar Noticias
on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fetch News
        run: python scripts/fetch_news.py
      - name: Save JSON
        run: |
          git config user.name "EpicentroBot"
          git config user.email "bot@epicentrochile.com"
          git add assets/data/noticias.json
          git commit -m "Auto-update: Viña 2026 News" || exit 0
          git push
